<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Smart Shower Meter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <meta name="theme-color" content="#0175C2">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Smart Shower Meter</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #pwa-install-banner {
      display: none;
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 16px;
      z-index: 9999;
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 16px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.16);
      padding: 16px;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      display: grid;
      grid-template-columns: 1fr auto;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #pwa-install-banner strong {
      display: block;
      margin-bottom: 6px;
      font-size: 1rem;
      color: #0f172a;
    }

    #pwa-install-banner p {
      margin: 0;
      font-size: 0.95rem;
      color: #334155;
      line-height: 1.4;
    }

    #pwa-install-banner button {
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    #pwa-install-button {
      background: #0175c2;
      color: white;
    }

    #pwa-install-close {
      background: transparent;
      color: #475569;
    }
  </style>
</head>

<body>
  <script src="flutter_bootstrap.js" async></script>
  <div id="pwa-install-banner">
    <div>
      <strong>Install Smart Shower Meter</strong>
      <p id="pwa-install-text">Install this app to your home screen for a faster, app-like experience. If install isn’t
        visible, use your browser menu and choose "Add to Home screen."</p>
    </div>
    <div style="display:flex; gap:8px; align-items:center; justify-content:end;">
      <button id="pwa-install-button" type="button">Install</button>
      <button id="pwa-install-close" type="button">Dismiss</button>
    </div>
  </div>
  <script>
    const installBanner = document.getElementById('pwa-install-banner');
    const installText = document.getElementById('pwa-install-text');
    const installButton = document.getElementById('pwa-install-button');
    const installClose = document.getElementById('pwa-install-close');
    let deferredPrompt = null;
    const dismissedKey = 'pwa-install-dismissed';

    function isStandalone() {
      return window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true ||
        document.referrer.startsWith('android-app://');
    }

    function hideInstallBanner() {
      installBanner.style.display = 'none';
    }

    function updateInstallBanner() {
      if (deferredPrompt) {
        installButton.textContent = 'Install';
        installText.textContent = 'Install this app to your home screen for a faster, app-like experience.';
      } else {
        installButton.textContent = 'How to install';
        installText.textContent = 'Use your browser menu and choose "Add to Home screen." On iOS Safari, tap Share → Add to Home Screen.';
      }
    }

    function showInstallBanner() {
      if (isStandalone() || window.localStorage.getItem(dismissedKey)) {
        hideInstallBanner();
        return;
      }
      updateInstallBanner();
      installBanner.style.display = 'grid';
    }

    window.addEventListener('beforeinstallprompt', (event) => {
      if (isStandalone()) {
        deferredPrompt = null;
        return;
      }
      event.preventDefault();
      deferredPrompt = event;
      updateInstallBanner();
      showInstallBanner();
      console.log('beforeinstallprompt event received');
    });

    installButton.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const choiceResult = await deferredPrompt.userChoice;
        console.log('PWA install prompt result:', choiceResult.outcome);
        deferredPrompt = null;
        if (choiceResult.outcome === 'accepted') {
          window.localStorage.removeItem(dismissedKey);
        } else {
          window.localStorage.setItem(dismissedKey, '1');
        }
        hideInstallBanner();
        return;
      }

      if (installButton.textContent === 'Close') {
        hideInstallBanner();
        return;
      }

      installText.textContent = 'Install manually from your browser menu. On iOS Safari, tap Share → Add to Home Screen.';
      installButton.textContent = 'Close';
    });

    installClose.addEventListener('click', () => {
      window.localStorage.setItem(dismissedKey, '1');
      hideInstallBanner();
    });

    window.addEventListener('appinstalled', () => {
      console.log('App installed event received');
      window.localStorage.removeItem(dismissedKey);
      deferredPrompt = null;
      hideInstallBanner();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('flutter_service_worker.js')
          .then(() => console.log('Service worker registered'))
          .catch((err) => console.warn('Service worker registration failed', err));
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      showInstallBanner();
    });
  </script>
</body>

</html>
